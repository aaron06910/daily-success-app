function authModal(mode='signin'){const signedUp=mode==='signup',title=signedUp?'Create your Daily Success account':'Sign in to Daily Success';openModal(title,`<div class="auth-note" style="margin-bottom:14px">Your browser stays the fast local copy. Supabase adds secure backup and sync across your devices.</div><div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="authPassword" type="password" autocomplete="${signedUp?'new-password':'current-password'}" placeholder="${signedUp?'Create a password':'Your password'}"></div><button class="btn primary" data-action="${signedUp?'auth-signup':'auth-signin'}" style="width:100%;margin-top:14px">${signedUp?'Create account':'Sign in'}</button><div class="inline" style="margin-top:10px"><button class="btn soft" data-action="${signedUp?'show-signin':'show-signup'}">${signedUp?'I already have an account':'Create account'}</button>${signedUp?'':'<button class="btn" data-action="auth-reset">Forgot password?</button>'}</div><div class="auth-note" style="margin-top:12px">You can keep using Daily Success locally even while signed out.</div>`)}
function cloudAccountModal(){if(!currentUser)return authModal('signin');const initial=(currentUser.email||'?').slice(0,1).toUpperCase();openModal('Daily Success Cloud',`<div class="account-box"><div class="account-avatar">${esc(initial)}</div><div class="account-main"><div class="account-email">${esc(currentUser.email||'Signed in')}</div><div class="tiny">Supabase account connected</div></div></div><div class="cloud-status-grid"><div class="cloud-stat"><b>${esc(syncMessage)}</b><span>Current sync status</span></div><div class="cloud-stat"><b>${lastCloudSyncAt?lastCloudSyncAt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—'}</b><span>Last cloud save</span></div></div><div class="inline" style="margin-top:14px"><button class="btn primary" data-action="sync-now">Sync now</button><button class="btn" data-action="load-cloud">Reload cloud</button><button class="btn danger" data-action="auth-signout">Sign out</button></div>`)}
async function initCloud(){if(!cloudClient){setSyncStatus('error','Cloud unavailable');cloudBooting=false;return}try{const {data}=await cloudClient.auth.getSession();currentUser=data.session?.user||null;if(currentUser)await reconcileCloud();else setSyncStatus('local','Local only');cloudClient.auth.onAuthStateChange(async(event,session)=>{currentUser=session?.user||null;if(currentUser&&event==='SIGNED_IN')await reconcileCloud();else if(!currentUser)setSyncStatus('local','Local only');if(activePage==='settings')renderSettings()});}catch(err){console.error(err);setSyncStatus('error','Cloud unavailable')}finally{cloudBooting=false}}

function applyTheme(){let theme=state.settings.theme;if(theme==='system')theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=theme;document.documentElement.style.setProperty('--accent',state.settings.accent||'#6d5dfc');document.querySelector('meta[name="theme-color"]').setAttribute('content',state.settings.accent||'#6d5dfc')}
function dayOfWeek(k){return dateFromKey(k).getDay()}
function taskDue(t,k){if(t.archived)return false;if(t.recurrence==='daily')return true;if(t.recurrence==='weekdays')return dayOfWeek(k)>=1&&dayOfWeek(k)<=5;if(t.recurrence==='weekends')return [0,6].includes(dayOfWeek(k));if(t.recurrence==='weekly')return (t.days||[]).includes(dayOfWeek(k));return t.date===k}
function tasksFor(k,area=null){return state.tasks.filter(t=>taskDue(t,k)&&(!area||t.area===area)).sort((a,b)=>(b.priority||0)-(a.priority||0))}
function isDone(t,k){return (t.completedDates||[]).includes(k)}
function dailyScore(k){const ts=tasksFor(k);if(!ts.length)return null;return Math.round(ts.filter(t=>isDone(t,k)).length/ts.length*100)}
function checkin(k){if(!state.checkins[k])state.checkins[k]={};return state.checkins[k]}
function getCheckin(k){return state.checkins[k]||{}}
function avg(field,days=7,end=selectedDate){const vals=[];for(let i=0;i<days;i++){const raw=getCheckin(addDays(end,-i))[field],v=Number(raw);if(raw!==''&&raw!==undefined&&raw!==null&&Number.isFinite(v))vals.push(v)}return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}
function total(field,days=7,end=selectedDate){let n=0;for(let i=0;i<days;i++)n+=Number(getCheckin(addDays(end,-i))[field]||0);return n}
function areaTasksHTML(area,k=selectedDate){const ts=tasksFor(k,area);return taskListHTML(ts,k)}
function taskListHTML(ts,k){if(!ts.length)return `<div class="empty"><b>Nothing scheduled</b>Add a task or habit when something deserves your attention.</div>`;return `<div class="task-list">${ts.map(t=>taskHTML(t,k)).join('')}</div>`}
function taskHTML(t,k){const done=isDone(t,k),project=(state.projects||[]).find(p=>p.id===t.projectId);return `<div class="task ${done?'done':''}"><button class="check ${done?'checked':''}" data-action="toggle-task" data-id="${t.id}" data-date="${k}">${done?'✓':''}</button><div class="task-body"><div class="task-title">${esc(t.title)}</div>${t.description?`<div class="task-desc">${esc(t.description)}</div>`:''}<div class="badges"><span class="badge area">${AREAS[t.area]?.label||'Life'}</span>${t.startTime?`<span class="badge">${esc(t.startTime)}${t.duration?` · ${t.duration}m`:''}</span>`:''}${project?`<span class="badge">${icon('folder',10)} ${esc(project.title)}</span>`:''}${t.recurrence!=='none'?`<span class="badge">${esc(t.recurrence)}</span>`:''}${t.priority?`<span class="badge">Priority ${t.priority}</span>`:''}</div></div><div class="task-actions">${t.recurrence==='none'&&!done?`<button class="mini" title="Push to tomorrow" data-action="push-task" data-id="${t.id}">→</button>`:''}<button class="mini" title="Edit" data-action="edit-task" data-id="${t.id}">✎</button><button class="mini" title="Delete" data-action="delete-task" data-id="${t.id}">×</button></div></div>`}
function goalPct(g){const t=Number(g.target||0),c=Number(g.current||0);return t>0?Math.max(0,Math.min(100,Math.round(c/t*100))):0}
function goalsFor(area){return state.goals.filter(g=>!area||g.area===area)}
function goalsHTML(goals){if(!goals.length)return `<div class="empty"><b>No goals yet</b>Create a measurable goal and connect your habits to something bigger.</div>`;return goals.map(g=>`<div class="goal"><div class="goal-top"><div><div class="goal-title">${esc(g.title)}</div><div class="tiny">${AREAS[g.area]?.label||'Life'}${g.deadline?` · Due ${fmtDate(g.deadline,{month:'short',day:'numeric',year:'numeric'})}`:''}</div></div><div class="goal-num">${esc(g.current||0)} / ${esc(g.target||0)} ${esc(g.unit||'')}</div></div><div class="progress sm"><span style="width:${goalPct(g)}%"></span></div><div class="inline" style="margin-top:9px"><button class="btn soft" data-action="update-goal" data-id="${g.id}">Update</button><button class="btn" data-action="edit-goal" data-id="${g.id}">Edit</button><button class="btn danger" data-action="delete-goal" data-id="${g.id}">Delete</button></div></div>`).join('')}
function renderSidebar(){document.getElementById('inboxCount').textContent=state.inbox.length;document.getElementById('momentumVal').textContent=state.momentum||0;const st=calcStreak();document.getElementById('streakVal').textContent=st.current;document.getElementById('bestStreakVal').textContent=st.best;document.querySelectorAll('.nav-ico[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon))}
function calcStreak(){let best=0,run=0,current=0;const goal=Number(state.settings.successGoal||75);for(let i=120;i>=0;i--){const k=addDays(todayKey(),-i),s=dailyScore(k);if(s!==null&&s>=goal){run++;best=Math.max(best,run)}else if(s!==null)run=0}run=0;for(let i=0;i<120;i++){const k=addDays(todayKey(),-i),s=dailyScore(k);if(s!==null&&s>=goal)run++;else if(s===null&&i===0)continue;else break}current=run;return{current,best}}

function handleChange(e){const tf=e.target.dataset.trackfield;if(tf){const d=trackerDef(tf),c=checkin(selectedDate);c[tf]=e.target.type==='checkbox'?e.target.checked:(e.target.value===''?'':d?.type==='text'?e.target.value:Number(e.target.value));save();renderPage(activePage);return}const cf=e.target.dataset.checkfield;if(cf){const c=checkin(selectedDate);c[cf]=e.target.type==='checkbox'?e.target.checked:(e.target.value===''?'':Number(e.target.value));save();renderPage(activePage);return}const ff=e.target.dataset.finfield;if(ff){state.financeSnapshot[ff]=e.target.value===''?'':Number(e.target.value);save();return}if(e.target.id==='themeSelect'){state.settings.theme=e.target.value;save();applyTheme()}if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0])}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`daily-success-backup-${todayKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(file){const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj!=='object')throw Error();state=deepMerge(clone(DEFAULT_STATE),obj);save();renderAll();toast('Backup imported')}catch(e){toast('Could not import that file')}};r.readAsText(file)}

function monthKey(k=selectedDate){return k.slice(0,7)}
function yearKey(k=selectedDate){return k.slice(0,4)}
function quarterNum(k=selectedDate){return Math.floor((Number(k.slice(5,7))-1)/3)+1}
function quarterKey(k=selectedDate){return `${yearKey(k)}-Q${quarterNum(k)}`}
function planKey(level,k=selectedDate){if(level==='yearly')return yearKey(k);if(level==='quarterly')return quarterKey(k);if(level==='monthly')return monthKey(k);return weekStart(k)}
function planLabel(level,k=selectedDate){if(level==='yearly')return yearKey(k);if(level==='quarterly')return `Q${quarterNum(k)} ${yearKey(k)}`;if(level==='monthly')return dateFromKey(k).toLocaleDateString(undefined,{month:'long',year:'numeric'});const st=weekStart(k);return `${fmtDate(st,{month:'short',day:'numeric'})} – ${fmtDate(addDays(st,6),{month:'short',day:'numeric'})}`}

function renderProjects(){ensureOSState();const active=state.projects.filter(p=>p.status!=='done'),done=state.projects.filter(p=>p.status==='done');document.getElementById('page-projects').innerHTML=pageHead('Projects','The missing layer between a goal and a task: multi-step outcomes with milestones.',`<button class="btn primary" data-action="new-project">＋ New project</button>`)+`<div class="card briefing"><div class="stat-strip"><div class="stat-chip"><b>${active.length}</b><span>Active</span></div><div class="stat-chip"><b>${done.length}</b><span>Completed</span></div><div class="stat-chip"><b>${state.projects.reduce((n,p)=>n+(p.milestones||[]).filter(m=>m.done).length,0)}</b><span>Milestones done</span></div><div class="stat-chip"><b>${state.tasks.filter(t=>t.projectId).length}</b><span>Linked tasks</span></div></div></div><div class="os-section"><div class="card-head"><h3>Active projects</h3><span class="tiny">Move the outcomes that matter</span></div>${active.length?`<div class="project-grid">${active.map(projectCardHTML).join('')}</div>`:`<div class="empty"><b>No active projects.</b>Use projects for anything that takes several steps, not a single checkbox.</div>`}</div>${done.length?`<div class="os-section"><div class="card-head"><h3>Completed</h3><span class="badge">${done.length}</span></div><div class="project-grid">${done.slice(0,6).map(projectCardHTML).join('')}</div></div>`:''}`}

function renderCalendarOS(){const el=document.getElementById('page-calendar'),y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=keyFromDate(d),score=dailyScore(k),tcount=tasksFor(k).length,wc=state.workouts.filter(w=>w.date===k).length,bc=state.timeBlocks.filter(b=>b.date===k).length;cells.push(`<div class="day ${d.getMonth()!==m?'other':''} ${k===todayKey()?'today':''} ${k===selectedDate?'selected':''}" data-caldate="${k}"><div class="day-num">${d.getDate()}</div><div class="dots">${tcount?`<span class="dot"></span>`:''}${score!==null&&score>=Number(state.settings.successGoal||75)?`<span class="dot good"></span>`:''}${wc?`<span class="dot workout"></span>`:''}${bc?`<span class="dot" style="background:#9a6af1"></span>`:''}</div>${tcount||bc?`<div class="cal-note">${tcount+bc} item${tcount+bc===1?'':'s'}</div>`:''}</div>`)}el.innerHTML=pageHead('Calendar','Month view plus local time blocking for the things that need an actual place in your day.',`<div class="inline"><button class="btn" data-action="cal-prev">‹</button><b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="btn" data-action="cal-next">›</button></div>`)+`<div class="card"><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells.join('')}</div></div><div class="spacer"></div>${scheduleHTML(selectedDate)}`}

function commandItems(q=''){q=q.trim().toLowerCase();const pages=[['today','Today'],['projects','Projects'],['routines','Routines'],['planning','Planning'],['calendar','Calendar'],['vault','Knowledge Vault'],['timeline','Timeline'],['ai','AI Advisor'],['insights','Insights'],['goals','Goals'],['stats','Stats'],['review','Weekly Reset'],['reviews','Long Reviews'],['settings','Settings']].map(([id,label])=>({type:'page',id,label,sub:'Page',icon:'search'}));const tasks=(state.tasks||[]).map(x=>({type:'task',id:x.id,label:x.title,sub:`Task · ${AREAS[x.area]?.label||'Life'}`,icon:'target'}));const projects=(state.projects||[]).map(x=>({type:'project',id:x.id,label:x.title,sub:`Project · ${AREAS[x.area]?.label||'Life'}`,icon:'folder'}));const routines=(state.routines||[]).map(x=>({type:'routine',id:x.id,label:x.title,sub:`Routine · ${AREAS[x.area]?.label||'Life'}`,icon:'layers'}));const vault=(state.vault||[]).map(x=>({type:'vault',id:x.id,label:x.title||x.body.slice(0,50),sub:'Knowledge Vault',icon:'archive'}));let all=[...pages,...tasks,...projects,...routines,...vault];if(q)all=all.filter(x=>(x.label+' '+x.sub).toLowerCase().includes(q));return all.slice(0,18)}

function pearson(xs,ys){const n=Math.min(xs.length,ys.length);if(n<5)return null;const ax=xs.reduce((a,b)=>a+b,0)/n,ay=ys.reduce((a,b)=>a+b,0)/n;let num=0,dx=0,dy=0;for(let i=0;i<n;i++){const x=xs[i]-ax,y=ys[i]-ay;num+=x*y;dx+=x*x;dy+=y*y}const den=Math.sqrt(dx*dy);return den?num/den:null}
function localInsights(){const out=[],today=todayKey();const scoreRange=(offset,days)=>{const vals=[];for(let i=offset;i<offset+days;i++){const sc=dailyScore(addDays(today,-i));if(sc!==null)vals.push(sc)}return vals};const a=scoreRange(0,7),b=scoreRange(7,7);if(a.length>=3&&b.length>=3){const av=x=>x.reduce((q,w)=>q+w,0)/x.length,d=Math.round(av(a)-av(b));out.push({icon:'chart',title:`Success score ${d>=0?'up':'down'} ${Math.abs(d)} points`,text:`Your recent 7-day average is ${Math.round(av(a))}% versus ${Math.round(av(b))}% the week before.`,confidence:'7-day trend'})}const mins=state.focusSessions.filter(f=>(f.startedAt||'').slice(0,10)>=addDays(today,-6)).reduce((n,f)=>n+Number(f.seconds||0)/60,0);if(mins>0)out.push({icon:'timer',title:`${Math.round(mins)} focused minutes this week`,text:'Focus Mode logs concentrated work separately from task completion, so effort is visible even before a project is finished.',confidence:'Focus history'});const numeric=trackerDefs().filter(d=>['number','scale'].includes(d.type));const corr=[];for(const d of numeric){const xs=[],ys=[];for(let i=0;i<35;i++){const k=addDays(today,-i),v=getCheckin(k)[d.id],sc=dailyScore(k);if(v!==''&&v!==undefined&&v!==null&&sc!==null&&Number.isFinite(Number(v))){xs.push(Number(v));ys.push(sc)}}const r=pearson(xs,ys);if(r!==null&&Math.abs(r)>=.28)corr.push({d,r,n:xs.length})}corr.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r)).slice(0,3).forEach(x=>out.push({icon:'lightbulb',title:`${x.d.label} moves with your Success Score`,text:`On ${x.n} logged days, ${x.r>0?'higher':'lower'} ${x.d.label.toLowerCase()} tended to coincide with ${x.r>0?'higher':'lower'} Daily Success scores. This is correlation, not proof of cause.`,confidence:`Correlation r=${x.r.toFixed(2)}`}));const active=state.projects.filter(p=>p.status==='active');if(active.length){const avg=Math.round(active.reduce((n,p)=>n+projectProgress(p),0)/active.length);out.push({icon:'folder',title:`Active projects average ${avg}% complete`,text:`You have $ function taskStatusForHub(t){if(t.recurrence&&t.recurrence!=='none')return 'recurring';if(isDone(t,t.date||todayKey()))return 'done';if((t.date||todayKey())<todayKey())return 'overdue';if((t.date||todayKey())===todayKey())return 'today';return 'upcoming'}
function renderTasksHub(){ensureOSState();const all=state.tasks.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||Number(b.priority||0)-Number(a.priority||0)),q=taskHubQuery.trim().toLowerCase();let rows=all.filter(t=>taskHubArea==='all'||t.area===taskHubArea).filter(t=>!q||`${t.title} ${t.description||''} ${AREAS[t.area]?.label||''}`.toLowerCase().includes(q));if(taskHubStatus==='open')rows=rows.filter(t=>!['done'].includes(taskStatusForHub(t)));else if(taskHubStatus!=='all')rows=rows.filter(t=>taskStatusForHub(t)===taskHubStatus);const groups=[['overdue','Overdue'],['today','Today'],['upcoming','Upcoming'],['recurring','Recurring'],['done','Completed']];document.getElementById('page-tasks').innerHTML=pageHead('Tasks','One place to see commitments across every area and project.',`<button class="btn primary" data-action="new-task">＋ New task</button>`)+`<div class="card"><div class="task-toolbar"><input id="taskHubSearch" placeholder="Search tasks…" value="${esc(taskHubQuery)}"><select id="taskHubArea"><option value="all">All areas</option>${Object.keys(AREAS).map(a=>`<option value="${a}" ${taskHubArea===a?'selected':''}>${AREAS[a].label}</option>`).join('')}</select><select id="taskHubStatus"><option value="open" ${taskHubStatus==='open'?'selected':''}>Open</option><option value="all" ${taskHubStatus==='all'?'selected':''}>All</option><option value="overdue" ${taskHubStatus==='overdue'?'selected':''}>Overdue</option><option value="today" ${taskHubStatus==='today'?'selected':''}>Today</option><option value="upcoming" ${taskHubStatus==='upcoming'?'selected':''}>Upcoming</option><option value="recurring" ${taskHubStatus==='recurring'?'selected':''}>Recurring</option><option value="done" ${taskHubStatus==='done'?'selected':''}>Completed</option></select><button class="btn" data-action="ai-plan-day">${icon('brain',14)} Plan today</button></div></div>${groups.map(([key,label])=>{const g=rows.filter(t=>taskStatusForHub(t)===key);if(!g.length)return '';return `<div class="task-section"><div class="task-section-title"><h3>${label}</h3><span class="badge">${g.length}</span></div><div class="task-group">${g.slice(0,key==='done'?20:80).map(t=>taskHTML(t,t.date||selectedDate)).join('')}</div></div>`}).join('')||`<div class="card task-empty">No tasks match these filters.</div>`}`}
function recommendedNextAction(){const open=tasksFor(selectedDate).filter(t=>!isDone(t,selectedDate));const sorted=open.slice().sort((a,b)=>Number(b.priority||0)-Number(a.priority||0)||(a.startTime||'99:99').localeCompare(b.startTime||'99:99'));if(sorted[0])return {title:sorted[0].title,sub:`${AREAS[sorted[0].area]?.label||'Life'}${sorted[0].startTime?' · '+sorted[0].startTime:''}${sorted[0].duration?' · '+sorted[0].duration+' min':''}`,type:'task',id:sorted[0].id};const p=state.projects.filter(x=>x.status==='active').sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'))[0];if(p)return {title:p.title,sub:`Project · ${projectProgress(p)}% complete`,type:'project',id:p.id};return {title:'Clarify the next meaningful action',sub:'Your task list is clear. Use Inbox or Planning to set direction.',type:'none',id:''}}
function missionControlHTML(){const next=recommendedNextAction(),weekly=(planData('weekly').priorities||[]).filter(Boolean).slice(0,3),open=tasksFor(selectedDate).filter(t=>!isDone(t,selectedDate)),schedule=scheduleItems(selectedDate),active=state.projects.filter(p=>p.status==='active'),attention=active.filter(p=>projectHealth(p).key!=='on-track'),inbox=state.inbox.length,focusMin=Math.round(state.focusSessions.filter(f=>(f.startedAt||'').slice(0,10)===selectedDate).reduce((n,f)=>n+Number(f.seconds||0)/60,0));return `<div class="mission-grid"><div class="mission-stack"><div class="card mission-card"><div class="mission-card-head"><div><div class="os-kicker">NEXT BEST ACTION</div><h3 style="margin:4px 0 0">Move one thing forward</h3></div><button class="btn soft" data-action="ai-next">${icon('brain',14)} Ask AI</button></div><div class="mission-card-body"><div class="next-action"><div class="next-action-icon">${icon(next.type==='project'?'folder':'target',20)}</div><div><h3>${esc(next.title)}</h3><p>${esc(next.sub)}</p></div>${next.type==='task'?`<button class="btn" data-action="start-task-focus" data-id="${next.id}">Focus</button>`:next.type==='project'?`<button class="btn" data-action="start-project-focus" data-id="${next.id}">Focus</button>`:''}</div></div></div><div class="card mission-card"><div class="mission-card-head"><div><div class="os-kicker">TODAY'S SCHEDULE</div><h3 style="margin:4px 0 0">Time commitments</h3></div><button class="btn soft" data-action="new-timeblock">＋ Block</button></div><div class="mission-card-body">${schedule.length?`<div class="schedule-mini">${schedule.slice(0,7).map(x=>{const a=AREAS[x.area]||AREAS.life;return `<div class="schedule-mini-row"><div class="schedule-mini-time">${esc(x.startTime)}</div><div class="schedule-mini-bar" style="--area:${a.color}"></div><div><div class="schedule-mini-title">${esc(x.title)}</div><div class="schedule-mini-sub">${esc(a.label)}${x.duration?' · '+x.duration+' min':''}</div></div></div>`}).join('')}</div>`:`<div class="empty"><b>No time blocks yet.</b>Your day is open. Add only the blocks that genuinely need a time.</div>`}</div></div></div><div class="mission-stack"><div class="card"><div class="card-head"><div><div class="os-kicker">SYSTEM STATUS</div><h3 style="margin:4px 0 0">Current load</h3></div><button class="mini" data-page-jump="insights">${icon('lightbulb',16)}</button></div><div class="status-grid"><div class="status-tile"><b>${open.length}</b><span>Open today</span></div><div class="status-tile"><b>${inbox}</b><span>Inbox</span></div><div class="status-tile"><b>${attention.length}</b><span>Projects at risk</span></div><div class="status-tile"><b>${focusMin}</b><span>Focus min</span></div></div></div><div class="card"><div class="card-head"><h3>Weekly priorities</h3><button class="mini" data-page-jump="planning">${icon('route',16)}</button></div>${weekly.length?`<div class="priority-list">${weekly.map((x,i)=>`<div class="priority-line"><span class="priority-num">${i+1}</span><div><div class="priority-title">${esc(x)}</div><div class="priority-meta">Weekly priority</div></div><span>${icon('target',13)}</span></div>`).join('')}</div>`:`<div class="empty"><b>No weekly priorities set.</b>Define three outcomes in Planning so daily work has direction.</div>`}</div><div class="card"><div class="card-head"><h3>Project health</h3><button class="mini" data-page-jump="projects">${icon('folder',16)}</button></div>${active.length?active.slice(0,4).map(p=>{const h=projectHealth(p);return `<div class="priority-line"><span class="health-pill ${h.key}">${h.label}</span><div><div class="priority-title">${esc(p.title)}</div><div class="priority-meta">${projectProgress(p)}% complete${p.deadline?' · Due '+fmtDate(p.deadline):''}</div></div><span></span></div>`}).join(''):`<div class="empty">No active projects.</div>`}</div></div></div>`}
function renderMissionControl(){renderToday();const el=document.getElementById('page-today'),hero=el.querySelector('.hero');if(hero){const h2=hero.querySelector('h2');if(h2)h2.textContent=(selectedDate===todayKey()?'Mission Control':'Daily Review');const p=hero.querySelector('p');if(p)p.textContent='Keep the day clear: know what matters, protect your attention, and capture everything else.';hero.insertAdjacentHTML('afterend',missionControlHTML())}const oldBrief=el.querySelector('.briefing');if(oldBrief)oldBrief.remove();const quick=el.querySelector('.quick-grid');if(quick){quick.innerHTML=`<button class="quick-tile" data-quick="task"><b>${icon('target')}</b>Task</button><button class="quick-tile" data-quick="inbox"><b>${icon('inbox')}</b>Capture</button><button class="quick-tile" data-action="open-focus"><b>${icon('timer')}</b>Focus</button><button class="quick-tile" data-action="new-timeblock"><b>${icon('clock')}</b>Time block</button><button class="quick-tile" data-action="open-command"><b>${icon('search')}</b>Search</button><button class="quick-tile" data-page-jump="ai"><b>${icon('brain')}</b>AI Advisor</button>`}}
function aiModeLabel(mode){return ({next:'Next Best Action',briefing:'Daily Briefing',weekly:'Weekly Strategy',insights:'Pattern Analysis',plan_day:'Plan My Day',triage:'Inbox Triage',project_rescue:'Project Rescue',chat:'AI Advisor'})[mode]||'AI Advisor'}
function proposalActionLabel(a){const map={create_task:'Create task',create_timeblock:'Add time block',create_project:'Create project',reschedule_task:'Reschedule task',set_priority:'Change priority',inbox_to_task:'Inbox → task',inbox_to_vault:'Inbox → Vault',update_project_status:'Update project'};return map[a.type]||a.type}
function aiProposalHTML(){if(!aiProposal?.actions?.length)return '';return `<div class="ai-proposal"><div class="ai-proposal-head"><div class="os-kicker">PROPOSED CHANGES</div><b>${esc(aiProposal.summary||'Review before applying')}</b>${aiProposal.rationale?`<div class="tiny" style="margin-top:4px">${esc(aiProposal.rationale)}</div>`:''}</div><div class="ai-proposal-actions">${aiProposal.actions.map((a,i)=>`<label class="proposal-row"><input type="checkbox" data-proposal-index="${i}" checked><span><div class="proposal-title">${esc(proposalActionLabel(a))} · ${esc(a.title||'')}</div><div class="proposal-detail">${esc(a.details||'')}${a.date?' · '+esc(a.date):''}${a.time?' · '+esc(a.time):''}</div></span></label>`).join('')}</div><div class="ai-proposal-footer"><button class="btn" data-action="discard-ai-proposal">Discard</button><button class="btn primary" data-action="apply-ai-proposal">Apply selected</button></div></div>`}
function applyProposalAction(a){const area=AREAS[a.area]?a.area:'life';if(a.type==='create_task'){state.tasks.push({id:uid(),title:a.title||'New task',description:a.details||'',area,date:a.date||todayKey(),recurrence:'none',days:[],priority:Number(a.priority||0),completedDates:[],startTime:a.time||'',duration:a.duration||''})}else if(a.type==='create_timeblock'){state.timeBlocks.push({id:uid(),title:a.title||'Time block',date:a.date||todayKey(),startTime:a.time||'09:00',duration:Number(a.duration||60),area,notes:a.details||''})}else if(a.type==='create_project'){state.projects.push({id:uid(),title:a.title||'New project',area,description:a.details||'',deadline:a.date||'',status:'active',milestones:[],createdAt:new Date().toISOString()})}else if(a.type==='reschedule_task'){const t=state.tasks.find(x=>x.id===a.target_id);if(t&&a.date)t.date=a.date}else if(a.type==='set_priority'){const t=state.tasks.find(x=>x.id===a.target_id);if(t)t.priority=Math.max(0,Math.min(3,Number(a.priority||0)))}else if(a.type==='inbox_to_task'){const item=state.inbox.find(x=>x.id===a.target_id);if(item){state.tasks.push({id:uid(),title:a.title||item.text,description:a.details||'',area,date:a.date||todayKey(),recurrence:'none',days:[],priority:Number(a.priority||0),completedDates:[],startTime:a.time||'',duration:a.duration||''});state.inbox=state.inbox.filter(x=>x.id!==item.id)}}else if(a.type==='inbox_to_vault'){const item=state.inbox.find(x=>x.id===a.target_id);if(item){state.vault.unshift({id:uid(),title:a.title||'Captured note',body:a.details||item.text,area,tags:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});state.inbox=state.inbox.filter(x=>x.id!==item.id)}}else if(a.type==='update_project_status'){const p=state.projects.find(x=>x.id===a.target_id);if(p&&['active','paused','backlog','done'].includes(a.status))p.status=a.status}}
function latestAssistantText(){return [...aiChat].reverse().find(x=>x.role==='assistant')?.text||''}
function aiContextCounts(){return {tasks:state.aiSettings.includeTasks?state.tasks.length:0,projects:state.aiSettings.includeProjects?state.projects.length:0,checkins:state.aiSettings.includeCheckins?Object.keys(state.checkins||{}).length:0,vault:state.aiSettings.includeVault?state.vault.length:0}}
function renderAIPro(){ensureOSState();const signed=!!currentUser,u=aiUsageSummary(),budget=Math.max(0,Number(state.settings.aiMonthlyBudget||5)),pct=budget?Math.min(100,u.cost/budget*100):0,c=aiContextCounts(),statusClass=aiBusy?'busy':aiStatus==='error'?'error':'ready';document.getElementById('page-ai').innerHTML=pageHead('AI Advisor','Use AI where judgment is valuable: prioritization, planning, review, pattern-finding and inbox processing.',`<button class="btn" data-action="clear-ai-chat">Clear session</button>`)+`<div class="card ai-hero"><div class="os-kicker">PERSONAL OPERATING ADVISOR</div><h2>Reason over the system, not just a prompt.</h2><p>The advisor receives only the Personal OS categories you permit. It can recommend changes, but structured changes always require your approval before anything is written.</p><div class="ai-hero-stats"><div class="ai-hero-stat"><b>${c.tasks}</b><span>Tasks available</span></div><div class="ai-hero-stat"><b>${c.projects}</b><span>Projects available</span></div><div class="ai-hero-stat"><b>${c.checkins}</b><span>Check-in days</span></div><div class="ai-hero-stat"><b>${c.vault}</b><span>Vault entries</span></div></div></div><div class="ai-shell os-section"><div class="card ai-chat-card"><div class="card-head"><div><div class="os-kicker">ADVISOR SESSION</div><h3 style="margin-top:4px">Conversation</h3></div><div class="ai-status"><span class="ai-status-dot ${statusClass}"></span><span>${esc(aiBusy?'Thinking…':aiStatusMessage)}</span></div></div><div class="ai-chat" id="aiChat">${signed?aiChatHTML():`<div class="empty"><b>Sign in to use AI Advisor.</b>The AI endpoint requires your Daily Success account, so anonymous visitors cannot use your API.<br><button class="btn primary" data-action="cloud-account" style="margin-top:12px">Sign in</button></div>`}</div>${signed?`${aiProposalHTML()}<div class="ai-composer"><textarea id="aiPrompt" placeholder="Ask a real operating question: What should I prioritize tonight? What am I neglecting? Help me decide between these options…"></textarea><div class="prompt-chips" style="margin-top:8px"><button class="prompt-chip" data-ai-prompt="I have limited time today. What is the highest-leverage use of it?">Limited time</button><button class="prompt-chip" data-ai-prompt="What am I doing that looks busy but is not moving my priorities forward?">Cut low-value work</button><button class="prompt-chip" data-ai-prompt="Look across my current commitments and tell me what is at risk of slipping.">Risk scan</button></div><div class="inline" style="margin-top:9px"><button class="btn primary" data-action="send-ai">Ask Advisor</button><button class="btn" data-action="save-ai-to-vault" ${latestAssistantText()?'':'disabled'}>Save answer to Vault</button></div></div>`:''}</div><div><div class="card"><div class="card-head"><h3>Operating tools</h3><span class="badge">On demand</span></div><div class="ai-section-title">Plan & execute</div><div class="ai-actions"><button class="ai-action" data-action="ai-mode" data-mode="next"><span class="ai-action-icon">${icon('target',16)}</span><span><b>Next Best Action</b><span class="tiny">Choose one high-leverage move now</span></span><span class="ai-action-tag">Advice</span></button><button class="ai-action" data-action="ai-mode" data-mode="plan_day"><span class="ai-action-icon">${icon('calendar',16)}</span><span><b>Plan My Day</b><span class="tiny">Propose priorities and time blocks</span></span><span class="ai-action-tag">Actions</span></button><button class="ai-action" data-action="ai-mode" data-mode="triage"><span class="ai-action-icon">${icon('inbox',16)}</span><span><b>Triage Inbox</b><span class="tiny">Turn captures into tasks or reference</span></span><span class="ai-action-tag">Actions</span></button><button class="ai-action" data-action="ai-mode" data-mode="project_rescue"><span class="ai-action-icon">${icon('folder',16)}</span><span><b>Project Rescue</b><span class="tiny">Find stalled work and propose recovery</span></span><span class="ai-action-tag">Actions</span></button></div><div class="ai-section-title">Review & learn</div><div class="ai-actions"><button class="ai-action" data-action="ai-mode" data-mode="briefing"><span class="ai-action-icon">${icon('home',16)}</span><span><b>Daily Briefing</b><span class="tiny">Priorities, risks and order of attack</span></span><span class="ai-action-tag">Brief</span></button><button class="ai-action" data-action="ai-mode" data-mode="weekly"><span class="ai-action-icon">${icon('refresh',16)}</span><span><b>Weekly Strategy</b><span class="tiny">Wins, bottlenecks and next week</span></span><span class="ai-action-tag">Review</span></button><button class="ai-action" data-action="ai-mode" data-mode="insights"><span class="ai-action-icon">${icon('lightbulb',16)}</span><span><b>Pattern Analysis</b><span class="tiny">Evidence-aware trends and experiments</span></span><span class="ai-action-tag">Analyze</span></button></div></div><div class="card" style="margin-top:16px"><div class="card-head"><h3>AI usage this month</h3><span class="badge">Estimate</span></div><div class="cost-line"><span>${u.requests} request${u.requests===1?'':'s'}</span><b>$${u.cost.toFixed(2)}</b></div><div class="usage-meter"><span style="width:${pct}%"></span></div><div class="tiny" style="margin-top:7px">Soft budget $${budget.toFixed(2)} · ${u.input.toLocaleString()} input / ${u.output.toLocaleString()} output tokens</div>${budgetBlocked()?`<div class="empty" style="margin-top:10px"><b>Budget guard reached.</b>AI calls are paused until next month or until you change the limit in Settings.</div>`:''}</div><div class="card" style="margin-top:16px"><div class="card-head"><h3>Context permissions</h3><button class="btn soft" data-page-jump="insights">Manage</button></div><div class="ai-permissions-summary">${aiPermBadge('includeTasks','Tasks')}${aiPermBadge('includeProjects','Projects')}${aiPermBadge('includeCheckins','Check-ins')}${aiPermBadge('includeVault','Vault')}</div><p class="tiny" style="margin-top:9px">Chat history is session-only. Structured changes require approval.</p></div></div></div>`;setTimeout(()=>{const x=document.getElementById('aiChat');if(x)x.scrollTop=x.scrollHeight},0)}
function registerEvents(){document.addEventListener('click',handleClick);document.addEventListener('click',handleOSClick);document.addEventListener('change',handleChange);document.addEventListener('change',handleOSChange);document.addEventListener('input',handleOSInput);document.getElementById('quickAddBtn').onclick=()=>quickAdd('task');document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.getElementById('prevDate').onclick=()=>{selectedDate=addDays(selectedDate,-1);renderAll()};document.getElementById('nextDate').onclick=()=>{selectedDate=addDays(selectedDate,1);renderAll()};document.getElementById('todayBtn').onclick=()=>{selectedDate=todayKey();calendarCursor=new Date();renderAll()};document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.addEventListener('click',e=>{const pp=e.target.closest('[data-ai-prompt]');if(pp){const ta=document.getElementById('aiPrompt');if(ta){ta.value=pp.dataset.aiPrompt;ta.focus()}}const mp=e.target.closest('[data-mobile-page]');if(mp){renderPage(mp.dataset.mobilePage);document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarScrim')?.classList.remove('open')}const ma=e.target.closest('[data-mobile-action]');if(ma?.dataset.mobileAction==='capture')quickAdd('inbox');if(ma?.dataset.mobileAction==='menu'){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarScrim')?.classList.add('open')}});document.getElementById('sidebarScrim')?.addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarScrim').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.target?.id==='aiPrompt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('[data-action="send-ai"]')?.click();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandModal()}if(e.key==='Escape')closeModal()})}
registerEvents();document.documentElement.classList.toggle('compact',!!state.settings.compactMode);applyTheme();renderAll();initCloud();if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
